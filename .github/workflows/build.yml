
name: Build LuminFish 2.6 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: luminfish-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LuminFish 2.6
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fix duplicate Kotlin declaration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/solmacro/MainActivity.kt")
          if not path.is_file():
              raise SystemExit(f"Missing source: {path}")

          source = path.read_text(encoding="utf-8")
          lines = source.splitlines(keepends=True)

          if len(lines) < 962:
              raise SystemExit("Unexpected source file length.")

          if not re.search(r'\bval\s+fl\b', lines[834]):
              raise SystemExit("Expected first declaration at line 835 not found.")

          match = re.search(r'\bval\s+(fl)\b', lines[961])
          if not match:
              raise SystemExit("Expected second declaration at line 962 not found.")

          start = sum(len(x) for x in lines[:961]) + match.start(1)

          def skip(text, i):
              if text.startswith("//", i):
                  end = text.find("\n", i)
                  return len(text) if end == -1 else end

              if text.startswith("/*", i):
                  depth = 1
                  i += 2
                  while i < len(text) and depth:
                      if text.startswith("/*", i):
                          depth += 1
                          i += 2
                      elif text.startswith("*/", i):
                          depth -= 1
                          i += 2
                      else:
                          i += 1
                  return i

              if text.startswith('"""', i):
                  end = text.find('"""', i + 3)
                  return len(text) if end == -1 else end + 3

              if text[i] in ('"', "'"):
                  quote = text[i]
                  i += 1
                  while i < len(text):
                      if text[i] == "\\":
                          i += 2
                      elif text[i] == quote:
                          return i + 1
                      else:
                          i += 1
                  return i

              return i

          stack = []
          i = 0
          while i < start:
              j = skip(source, i)
              if j != i:
                  i = j
                  continue
              if source[i] == "{":
                  stack.append(i)
              elif source[i] == "}" and stack:
                  stack.pop()
              i += 1

          if not stack:
              raise SystemExit("Could not identify Kotlin scope.")

          depth = 1
          end_scope = None
          i = start + 2

          while i < len(source):
              j = skip(source, i)
              if j != i:
                  i = j
                  continue
              if source[i] == "{":
                  depth += 1
              elif source[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end_scope = i
                      break
              i += 1

          if end_scope is None:
              raise SystemExit("Could not locate end of Kotlin scope.")

          occurrences = []
          i = start

          while i < end_scope:
              j = skip(source, i)
              if j != i:
                  i = j
                  continue

              if source[i].isalpha() or source[i] == "_":
                  a = i
                  i += 1
                  while i < end_scope and (source[i].isalnum() or source[i] == "_"):
                      i += 1
                  if source[a:i] == "fl":
                      occurrences.append((a, i))
              else:
                  i += 1

          if not occurrences or occurrences[0][0] != start:
              raise SystemExit("Could not verify second declaration.")

          replacement = "fl_ui_962"
          if replacement in source:
              raise SystemExit("Replacement name already exists.")

          for a, b in reversed(occurrences):
              source = source[:a] + replacement + source[b:]

          path.write_text(source, encoding="utf-8")
          print("Second fl declaration renamed.")
          print("Original UI sections preserved.")
          PY

      - name: Check patch
        run: git diff --check

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload LuminFish APK
        uses: actions/upload-artifact@v6
        with:
          name: LuminFish-2.6-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports if build fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: LuminFish-2.6-build-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 7
